# Fly.io configuration for Cinema Radar
#
# The bot uses Telegram long polling, so it never binds an HTTP port: there is
# deliberately no [http_service], no [services] and no health check.
#
# Run exactly ONE machine. Two long-polling processes on the same token fight
# over getUpdates and Telegram answers both with 409 Conflict.
app = "cinema-radar-eg"
# Frankfurt serves all three cinemas.  Premiere's Cloudflare edge answers 403 to
# the Paris (cdg) address range, so keep the only machine where all providers
# are reachable.
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

# Give the bot time to cancel background jobs and close SQLite on redeploy.
kill_signal = "SIGINT"
kill_timeout = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpu_kind = "shared"

# Keeps cinemaradar.sqlite3 alive across deploys.  This volume was restored from
# the original cdg volume when the app moved to fra.
[[mounts]]
  source = "cinema_data_fra"
  destination = "/data"
  initial_size = 1

[env]
  DB_PATH = "/data/cinemaradar.sqlite3"
  PYTHONUNBUFFERED = "1"
  PYTHONPATH = "/app"
  # VOX Egypt resets plain TLS clients; curl_cffi gives the bot a real Chrome
  # fingerprint. Without this the VOX requests time out.
  HTTP_IMPERSONATE = "chrome124"
