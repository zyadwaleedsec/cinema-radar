# fly.toml app configuration file generated for cinema-radar on 2026-11-04T23:31:18Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cinema-radar'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/cinemaradar.sqlite3'
  PYTHONPATH = '/app'
  PYTHONUNBUFFERED = '1'

[[mounts]]
  source = 'cinema_data'
  destination = '/data'
  initial_size = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[checks]
  [checks.health]
    type = 'tcp'
    interval = '30s'
    timeout = '10s'
    grace_period = '20s'
    method = 'GET'
    protocol = 'tcp'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
