# Fly.io configuration for Cinema Radar
#
# The bot uses Telegram long polling, so it never binds an HTTP port:
# there is no [http_service] and no health check on purpose.
# Data lives on the `cinema_data` volume mounted at /data.
app = "cinema-radar"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

kill_timeout = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"

[[mounts]]
  source = "cinema_data"
  destination = "/data"
  initial_size = 1

[env]
  DB_PATH = "/data/cinemaradar.sqlite3"
  PYTHONUNBUFFERED = "1"
  PYTHONPATH = "/app"
