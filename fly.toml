# Fly.io configuration for Cinema Radar
#
# The bot uses Telegram long polling, so it never binds an HTTP port: there is
# deliberately no [http_service], no [services] and no health check.
#
# Run exactly ONE machine. Two long-polling processes on the same token fight
# over getUpdates and Telegram answers both with 409 Conflict.
app = "cinema-radar"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

# Give the bot time to cancel background jobs and close SQLite on redeploy.
kill_signal = "SIGINT"
kill_timeout = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"

# Keeps cinemaradar.sqlite3 alive across deploys.
[[mounts]]
  source = "cinema_data"
  destination = "/data"
  initial_size = 1

[env]
  DB_PATH = "/data/cinemaradar.sqlite3"
  PYTHONUNBUFFERED = "1"
  PYTHONPATH = "/app"
