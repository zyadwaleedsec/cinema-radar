# Fly.io configuration for Cinema Radar
app = "cinema-radar"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  auto_stop_machines = "off"
  auto_start_machines = true

[[mounts]]
  source = "cinema_data"
  destination = "/data"
  initial_size = 1

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[checks]
  [checks.health]
    type = "tcp"
    protocol = "tcp"
    grace_period = "20s"
    interval = "30s"
    timeout = "10s"
    method = "GET"

[env]
  DB_PATH = "/data/cinemaradar.sqlite3"
  PYTHONUNBUFFERED = "1"
  PYTHONPATH = "/app"
