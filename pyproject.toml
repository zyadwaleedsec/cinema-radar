[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "PERF", # performance
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length is handled by the formatter
    "BLE001", # background loops intentionally guard broad exceptions
    "B008",   # call defaults are fine for aiogram filters
    "RUF001", # Arabic strings/comments legitimately contain ambiguous glyphs
    "RUF002",
    "RUF003",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
